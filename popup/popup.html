<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LBC Tools</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main>
    <header><span class="logo">LBC</span>
      <div>
        <h1>LBC Tools</h1>
        <p>Outils pour Leboncoin</p>
      </div>
    </header>
    <section aria-label="Fonctionnalités">
      <label class="setting"><span><strong>Relister</strong><small>Ajouter le bouton sur mes
            annonces</small></span><input type="checkbox" data-setting="relister"></label>
      <label class="setting"><span><strong>Ancien prix</strong><small>Afficher le prix précédent et son
            évolution</small></span><input type="checkbox" data-setting="oldPrice"></label>
      <label class="setting"><span><strong>Dates</strong><small>Afficher les dates de publication et
            renouvellement</small></span><input type="checkbox" data-setting="dates"></label>
    </section>
  </main>
  <footer>Made by <a href="https://github.com/Drarox" target="_blank" rel="noreferrer">Drarox</a><br><a
      href="https://github.com/Drarox/lbc-tools" target="_blank" rel="noreferrer">GitHub Repository</a></footer>
  <script src="popup.js"></script>
</body>

</html>
